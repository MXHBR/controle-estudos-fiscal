<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle de Estudos - Auditor Fiscal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js Collapse Plugin -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col" x-data="appData()">

    <!-- HEADER -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-500/30">
                    <i data-lucide="graduation-cap" class="w-7 h-7"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-xl font-bold tracking-tight">Painel do Auditor Fiscal</h1>
                        <!-- Indicador de Status Supabase -->
                        <span x-text="syncStatus" :class="{
                            'bg-emerald-500/10 text-emerald-400 border-emerald-500/20': syncStatus === '☁️ Nuvem Sincronizada',
                            'bg-amber-500/10 text-amber-400 border-amber-500/20': syncStatus === '⏳ Guardando...',
                            'bg-rose-500/10 text-rose-400 border-rose-500/20': syncStatus === '❌ Erro ao Sincronizar'
                        }" class="text-[10px] px-2 py-0.5 rounded-full border font-semibold"></span>
                    </div>
                    <p class="text-xs text-slate-400">Controle Avançado de Estudos & Desempenho</p>
                </div>
            </div>
            <!-- Navegação por Abas -->
            <nav class="flex flex-wrap gap-1.5 bg-slate-900/60 p-1.5 rounded-xl border border-slate-700">
                <button @click="activeTab = 'dashboard'" :class="activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center gap-1.5">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
                </button>
                <button @click="activeTab = 'materias'" :class="activeTab === 'materias' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center gap-1.5">
                    <i data-lucide="book-open" class="w-4 h-4"></i> Matérias
                </button>
                <button @click="activeTab = 'questoes'" :class="activeTab === 'questoes' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center gap-1.5">
                    <i data-lucide="check-square" class="w-4 h-4"></i> Questões
                </button>
                <button @click="activeTab = 'gargalos'" :class="activeTab === 'gargalos' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center gap-1.5">
                    <i data-lucide="alert-triangle" class="w-4 h-4"></i> Gargalos
                </button>
                <button @click="activeTab = 'cronograma'" :class="activeTab === 'cronograma' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition flex items-center gap-1.5">
                    <i data-lucide="calendar" class="w-4 h-4"></i> Cronograma
                </button>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-8">

        <!-- TAB: DASHBOARD -->
        <section x-show="activeTab === 'dashboard'" class="space-y-6">
            <!-- Quadro de Lembretes Fixos -->
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-sm space-y-2">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-amber-400 flex items-center gap-2">
                        <i data-lucide="sticky-note" class="w-4 h-4"></i> Lembretes & Anotações Fixas
                    </h3>
                    <span class="text-[10px] text-slate-500">Sincronizado via Supabase</span>
                </div>
                <textarea x-model="lembreteFixado" @change="salvarTudoNaNuvem()" rows="3" placeholder="Digite aqui metas gerais, avisos ou lembretes rápidos para visualizar assim que abrir o site..." class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-amber-500/50 resize-y"></textarea>
            </div>

            <!-- Cards de Métricas -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-sm">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total de Questões</p>
                            <h3 class="text-2xl font-bold mt-1 text-white" x-text="stats.totalQuestao"></h3>
                        </div>
                        <div class="p-3 bg-blue-500/10 text-blue-400 rounded-xl">
                            <i data-lucide="file-text" class="w-6 h-6"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-sm">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Acertos / Erros</p>
                            <h3 class="text-2xl font-bold mt-1 text-emerald-400"><span x-text="stats.totalAcertos"></span> / <span class="text-rose-400" x-text="stats.totalErros"></span></h3>
                        </div>
                        <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-xl">
                            <i data-lucide="award" class="w-6 h-6"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-sm">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Aproveitamento Médio</p>
                            <h3 class="text-2xl font-bold mt-1 text-blue-400" x-text="stats.mediaAproveitamento + '%'"></h3>
                        </div>
                        <div class="p-3 bg-sky-500/10 text-sky-400 rounded-xl">
                            <i data-lucide="trending-up" class="w-6 h-6"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-sm">
                    <div class="flex justify-between items-start">
                        <div>
